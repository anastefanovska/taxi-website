<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620"
     role="img" aria-label="Илустрирана мапа на подрачјето на работа во Скопје">
  <title>Подрачје на работа — Скопје и околината</title>

  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
